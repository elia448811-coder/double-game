name: Deploy Auth Worker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-auth.yml'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install + smoke auth wiring
        run: |
          npm ci
          node scripts/test-auth.mjs

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            PASS_W
            SESSION_SECRET

      - name: Worker URL reminder
        run: |
          echo "Worker deployed. Set GitHub Variable VITE_AUTH_API_URL to the workers.dev URL."
          echo "Also set SESSION_SECRET (separate from PASS_W) when possible."
